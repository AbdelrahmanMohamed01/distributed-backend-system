name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      
jobs:

  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Increment Version Variable
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GCP_SA_KEY_OR_GH_TOKEN }} # Needs a PAT with 'repo' or 'settings' access
          script: |
            const currentVersion = parseInt("${{ vars.APP_VERSION }}".replace('v', ''));
            const nextVersion = `v${currentVersion + 1}`;
            
            await github.rest.actions.updateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'APP_VERSION',
              value: nextVersion
            });
            console.log(`Updated APP_VERSION to ${nextVersion}`);

      - name: Build Docker Image
        run: |
          docker build -t abdelrahmanmohamed01/distributed-backend:v5 .

      - name: Push Docker Image
        run: |
          docker push abdelrahmanmohamed01/distributed-backend:v5

  deploy-to-google-kubernetes-engine:
    needs: build-and-push-docker-image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: posts-cluster
          location: me-central1-a

      - name: Apply Kubernetes Files
        run: |
          kubectl apply -f k8s/backend/configmap.yaml
          kubectl apply -f k8s/mongodb/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/ingress/ingress.yaml

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/backend-deploy \
          backend=abdelrahmanmohamed01/distributed-backend:v5

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/backend-deploy
