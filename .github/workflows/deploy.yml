name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    
    outputs:
      new_tag: ${{ steps.version_step.outputs.NEW_TAG }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Increment and Capture Version
        id: version_step
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} 
          script: |
            const currentVersion = parseInt("${{ vars.APP_VERSION }}".replace('v', ''));
            const nextVersion = `v${currentVersion + 1}`;
            
            await github.rest.actions.updateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'APP_VERSION',
              value: nextVersion
            });
            
            // Set output for current and next steps
            core.setOutput('NEW_TAG', nextVersion);

      - name: Build and Push Docker Image
        run: |
          docker build -t abdelrahmanmohamed01/distributed-backend:${{ steps.version_step.outputs.NEW_TAG }} .
          docker push abdelrahmanmohamed01/distributed-backend:${{ steps.version_step.outputs.NEW_TAG }}

  deploy-to-google-kubernetes-engine:
    needs: build-and-push-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: posts-cluster
          location: me-central1-a

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/backend-deploy \
          backend=abdelrahmanmohamed01/distributed-backend:${{ needs.build-and-push-docker-image.outputs.new_tag }}
